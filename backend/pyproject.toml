[project]
name = "clinic-ai-callbot-backend"
version = "0.1.0"
description = "Self-hosted AI clinic receptionist — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "structlog>=24.4",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# -----------------------------------------------------------------------------
# Tooling
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # assert — used extensively in tests
    "B008",  # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"app/database/seed.py" = ["S311"]  # deterministic-seeded random for synthetic data

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]
# Live-model checks are opt-in: `uv run pytest` must pass with no Ollama, no
# speech models and no audio device. Run them with `uv run pytest -m llm_live`
# or `-m voice_live`.
addopts = "-m 'not llm_live and not voice_live'"
markers = [
    "integration: requires a live PostgreSQL database",
    "llm_live: requires a local Ollama runtime with the configured model pulled",
    "voice_live: requires the local Whisper weights and a Piper voice on disk",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]
