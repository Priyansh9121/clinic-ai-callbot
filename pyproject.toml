# =============================================================================
# uv workspace root.
#
# The root itself is a "virtual" project (not packaged); it exists so that a
# single `uv sync` at the repository root produces one .venv containing the
# backend in editable mode plus the development toolchain. This is what makes
#     uv run python scripts/clinic_chat.py
# work from the repository root.
# =============================================================================
[project]
name = "clinic-ai-callbot"
version = "0.1.0"
description = "Self-hosted AI clinic receptionist (workspace root)"
requires-python = ">=3.12"
dependencies = ["clinic-ai-callbot-backend"]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.2",
    "onnxruntime>=1.28.0",
    "piper-tts>=1.6.0",
    "sounddevice>=0.5.5",
    "soxr>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
clinic-ai-callbot-backend = { workspace = true }
